[project]
name = "dosm"
version = "0.1.0"
description = "Malaysia Tourism Value Optimizer - Analytical decision-support platform for sustainable tourism yield and corridor economics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Malaysia Tourism Value Optimizer Team" }
]
license = { text = "MIT" }
keywords = [
    "tourism",
    "malaysia",
    "tsa",
    "econometrics",
    "gravity-model",
    "sustainable-tourism",
    "sdg-8-9",
]
dependencies = [
    "duckdb>=1.5.5",
    "duckdb-mcp-server>=0.1.0",
    "ipykernel>=7.3.0",
    "jupyter-collaboration>=5.0.3",
    "jupyter-mcp-tools>=0.1.7",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "mcp-server-jupyter>=0.1.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/validation"]
markers = [
    "snapshot: Empirical baseline regression snapshot checks (distinguished from scientific hypothesis tests)",
]
